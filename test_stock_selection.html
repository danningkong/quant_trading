<!DOCTYPE html>
<html>
<head>
    <title>Test Stock Selection Feature</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .stock-checkbox:checked + label {
            background-color: rgba(0, 123, 255, 0.1);
            border-radius: 4px;
            padding: 2px 8px;
        }
        .form-check-label {
            cursor: pointer;
            width: 100%;
        }
        .form-check-label:hover {
            background-color: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
            padding: 2px 8px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h3>Stock Selection Feature Test</h3>
        
        <div class="mt-3">
            <h6>Select Symbols for Backtesting</h6>
            <div class="border p-3 rounded" style="max-height: 200px; overflow-y: auto;">
                <div class="mb-2">
                    <button type="button" class="btn btn-sm btn-outline-primary me-2" onclick="selectAllStocks()">Select All</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary me-2" onclick="deselectAllStocks()">Deselect All</button>
                    <small class="text-muted">(<span id="selectedCount">4</span> selected)</small>
                </div>
                <div class="row" id="stockSelection">
                    <div class="col-md-6 mb-2">
                        <div class="form-check">
                            <input class="form-check-input stock-checkbox" type="checkbox" value="AAPL" id="stock_0" checked onchange="updateSelectedCount()">
                            <label class="form-check-label d-flex justify-content-between align-items-center" for="stock_0">
                                <span><strong>AAPL</strong></span>
                                <span class="badge bg-secondary ms-2">0.845</span>
                            </label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-2">
                        <div class="form-check">
                            <input class="form-check-input stock-checkbox" type="checkbox" value="MSFT" id="stock_1" checked onchange="updateSelectedCount()">
                            <label class="form-check-label d-flex justify-content-between align-items-center" for="stock_1">
                                <span><strong>MSFT</strong></span>
                                <span class="badge bg-secondary ms-2">0.782</span>
                            </label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-2">
                        <div class="form-check">
                            <input class="form-check-input stock-checkbox" type="checkbox" value="GOOGL" id="stock_2" checked onchange="updateSelectedCount()">
                            <label class="form-check-label d-flex justify-content-between align-items-center" for="stock_2">
                                <span><strong>GOOGL</strong></span>
                                <span class="badge bg-secondary ms-2">0.721</span>
                            </label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-2">
                        <div class="form-check">
                            <input class="form-check-input stock-checkbox" type="checkbox" value="AMZN" id="stock_3" checked onchange="updateSelectedCount()">
                            <label class="form-check-label d-flex justify-content-between align-items-center" for="stock_3">
                                <span><strong>AMZN</strong></span>
                                <span class="badge bg-secondary ms-2">0.689</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="mt-3">
            <button class="btn btn-primary" onclick="getSelectedStocks()">Test Selection</button>
            <div id="result" class="mt-3"></div>
        </div>
    </div>
    
    <script>
        function selectAllStocks() {
            const checkboxes = document.querySelectorAll('.stock-checkbox');
            checkboxes.forEach(cb => cb.checked = true);
            updateSelectedCount();
        }

        function deselectAllStocks() {
            const checkboxes = document.querySelectorAll('.stock-checkbox');
            checkboxes.forEach(cb => cb.checked = false);
            updateSelectedCount();
        }

        function updateSelectedCount() {
            const selectedCheckboxes = document.querySelectorAll('.stock-checkbox:checked');
            const count = selectedCheckboxes.length;
            const countElement = document.getElementById('selectedCount');
            if (countElement) {
                countElement.textContent = count;
            }
        }
        
        function getSelectedStocks() {
            const selectedCheckboxes = document.querySelectorAll('.stock-checkbox:checked');
            const symbols = Array.from(selectedCheckboxes).map(cb => cb.value);
            document.getElementById('result').innerHTML = `
                <div class="alert alert-info">
                    <strong>Selected Stocks:</strong> ${symbols.join(', ')}<br>
                    <strong>Count:</strong> ${symbols.length}
                </div>
            `;
        }
    </script>
</body>
</html>
